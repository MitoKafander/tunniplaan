<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tunniplaan">
<title>Rosini tunniplaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one column; header with week stepper, "next up" strip, then a Mon–Fri grid (stacks on phones). Campus = colour. */
:root {
  --bg: #f5f6f3; --surface: #ffffff; --ink: #1b1f1d; --muted: #5d6662; --line: #dfe3df;
  --kesk: #2f5fd0; --kesk-soft: #e6edfb; --must: #c2551b; --must-soft: #fbece3;
  --warn: #9a6a00; --warn-soft: #fff4d6; --accent: #1b1f1d;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121513; --surface: #1b1f1d; --ink: #e8ece9; --muted: #9aa49f; --line: #2c322f;
  --kesk: #86a8ff; --kesk-soft: #1d2a47; --must: #ff9a62; --must-soft: #3a2418;
  --warn: #f2c14e; --warn-soft: #3a3016; --accent: #e8ece9; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1b1f1d; --ink: #e8ece9; --muted: #9aa49f; --line: #2c322f;
  --kesk: #86a8ff; --kesk-soft: #1d2a47; --must: #ff9a62; --must-soft: #3a2418;
  --warn: #f2c14e; --warn-soft: #3a3016; --accent: #e8ece9; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-size: clamp(24px, 4vw, 32px); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--kesk); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.sub { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.K { background: var(--kesk); } .dot.M { background: var(--must); }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs, .stepper { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tabs button, .stepper button { border: 0; background: transparent; padding: 8px 14px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.stepper .label { padding: 8px 12px; min-width: 150px; text-align: center; border-inline: 1px solid var(--line); font-weight: 600; }
.stepper button:hover, .tabs button:not([aria-selected="true"]):hover { background: var(--line); }

.refresh { display: inline-flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: progress; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--warn); }

.next { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.next .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.next strong { font-family: var(--f-display); font-size: 19px; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.day.today { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.day h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.day h3 .mono { color: var(--muted); font-size: 12px; font-weight: 500; }
.empty { color: var(--muted); font-size: 13px; }
.lesson { border-radius: 10px; padding: 9px 10px; display: grid; gap: 2px; border-left: 4px solid; min-width: 0; }
.lesson.K { background: var(--kesk-soft); border-color: var(--kesk); }
.lesson.M { background: var(--must-soft); border-color: var(--must); }
.lesson.kons { background: transparent; border-style: dashed; border-left-style: solid; border-width: 1px 1px 1px 4px; }
.lesson .time { font-family: var(--f-mono); font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.lesson .subj { font-weight: 600; overflow-wrap: anywhere; }
.lesson .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.lesson.past { opacity: .55; }
.note { font-size: 12.5px; border-radius: 8px; padding: 6px 8px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }

.campusnote { display: grid; gap: 6px; }
.campusnote p { margin: 0; font-size: 13px; color: var(--muted); }
.campusnote p b { color: var(--warn); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.totals { font-size: 13px; color: var(--muted); }

.lunch { display: grid; gap: 12px; }
.daychips { display: flex; flex-wrap: wrap; gap: 6px; }
.daychips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; }
.daychips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.menus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .menus { grid-template-columns: 1fr; } }
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; border-top: 4px solid; min-width: 0; }
.menu.K { border-top-color: var(--kesk); } .menu.M { border-top-color: var(--must); }
.menu h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 18px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.menu h3 small { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--muted); }
.menu h3 .here { color: var(--ink); background: var(--line); border-radius: 999px; padding: 2px 8px; }
.menu ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.menu li { overflow-wrap: anywhere; }
.menu li .lab { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.menu li.main { font-weight: 600; }
.foot { font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:grid;gap:6px">
      <h1>Mikk Rosin · tunniplaan</h1>
      <div class="sub">
        <span class="legend"><span class="dot K"></span>Kesklinn · Pärnu mnt 57</span>
        <span class="legend"><span class="dot M"></span>Mustamäe · Sõpruse pst 182</span>
      </div>
    </div>
    <div class="refresh">
      <span class="status" id="status">Laen…</span>
      <button class="btn" id="refreshBtn">Värskenda</button>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-tt" aria-selected="true">Tunniplaan</button>
      <button role="tab" id="tab-lunch" aria-selected="false">Lõuna</button>
    </div>
    <div class="stepper">
      <button id="prev" aria-label="Eelmine nädal">‹</button>
      <span class="label mono" id="weekLabel">—</span>
      <button id="next" aria-label="Järgmine nädal">›</button>
    </div>
  </div>

  <section id="view-tt" style="display:grid;gap:14px">
    <div class="next" id="nextUp"><span class="eyebrow">Järgmisena</span><strong>—</strong></div>
    <div class="campusnote" id="campusNote"></div>
    <div class="grid" id="grid"></div>
    <div class="totals" id="totals"></div>
    <details id="otherSubs" hidden><summary>Muud muudatused minu rühmades</summary><ul></ul></details>
  </section>

  <section id="view-lunch" class="lunch" hidden>
    <div class="daychips" id="dayChips"></div>
    <div class="menus" id="menus"></div>
  </section>

  <p class="foot" id="foot">Allikas: EduPage (kesklinn-techno, mustamae-techno) ja menuu.techno.ee. Andmed uuenevad koolipäevadel iga 30 min järel.</p>
</div>

<script>
const DAYS = ['Esmaspäev', 'Teisipäev', 'Kolmapäev', 'Neljapäev', 'Reede'];
const SHORT = ['E', 'T', 'K', 'N', 'R'];
const CAMPUS = { kesklinn: { code: 'K', name: 'Kesklinn', url: 'https://kesklinn-techno.edupage.org/timetable/' },
                 mustamae: { code: 'M', name: 'Mustamäe', url: 'https://mustamae-techno.edupage.org/timetable/' } };

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); return addDays(x, -((x.getDay() + 6) % 7)); };
const dm = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`;
const mins = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
const SCHOOL_WEEK1 = parseIso('2026-08-31');
const schoolWeek = mon => Math.floor((mon - SCHOOL_WEEK1) / (7 * 864e5)) + 1;

// EduPage's own start date is sometimes stale when a week is copied forward; the name carries the real range.
function versionMonday(v) {
  const m = String(v.name || '').match(/(\d{2})\.(\d{2})-\d{2}\.\d{2}\.(\d{2})/);
  if (m) return isoLocal(mondayOf(parseIso(`20${m[3]}-${m[2]}-${m[1]}`)));
  if (!v.from) return null;
  const d = parseIso(v.from);
  return isoLocal(mondayOf(d.getDay() === 0 ? addDays(d, 1) : d));
}

// ---------- state ----------
let snap = null;
let weekMon = mondayOf(new Date());
if (new Date().getDay() === 6 || new Date().getDay() === 0) weekMon = addDays(weekMon, 7);
let tab = 'tt';
let lunchDay = null;
try { if (localStorage.getItem('tt-tab') === 'lunch') tab = 'lunch'; } catch (e) {}

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function weekFor(campusKey, mon) {
  const c = snap && snap[campusKey];
  if (!c) return { state: 'none' };
  const key = isoLocal(mon);
  const tagged = (c.versions || []).map(v => ({ ...v, monday: versionMonday(v) })).filter(v => v.monday);
  const exact = tagged.filter(v => v.monday === key).pop();
  if (exact) return exact.hidden ? { state: 'hidden', v: exact } : { state: 'ok', v: exact };
  const earlier = tagged.filter(v => v.monday < key && !v.hidden).sort((a, b) => a.monday < b.monday ? -1 : 1).pop();
  const later = tagged.some(v => v.monday > key);
  if (earlier && !later && key <= isoLocal(addDays(parseIso(earlier.monday), 7 * 12))) return { state: 'carried', v: earlier };
  return { state: 'missing' };
}

function lessonsForWeek(mon) {
  const out = [], notes = [];
  for (const [key, meta] of Object.entries(CAMPUS)) {
    const w = weekFor(key, mon);
    if (w.state === 'ok' || w.state === 'carried')
      for (const b of w.v.blocks || []) out.push({ ...b, campus: meta.code, campusName: meta.name });
    notes.push({ key, meta, w });
  }
  out.sort((a, b) => a.day - b.day || mins(a.start) - mins(b.start));
  return { out, notes };
}

// ---------- render ----------
function render() {
  $('tab-tt').setAttribute('aria-selected', tab === 'tt');
  $('tab-lunch').setAttribute('aria-selected', tab === 'lunch');
  $('view-tt').hidden = tab !== 'tt';
  $('view-lunch').hidden = tab !== 'lunch';
  const fri = addDays(weekMon, 4);
  $('weekLabel').textContent = `näd ${schoolWeek(weekMon)} · ${dm(weekMon)}–${dm(fri)}`;
  if (snap) {
    const t = new Date(snap.fetchedAt);
    const age = (Date.now() - t) / 36e5;
    const st = $('status');
    st.className = 'status' + (age > 30 ? ' err' : '');
    st.textContent = `EduPage seis ${dm(t)} kell ${pad(t.getHours())}:${pad(t.getMinutes())}` + (age > 30 ? ' · andmed on vanad' : '');
  }
  renderNext();
  renderGrid();
  renderLunch();
}

function renderNext() {
  const box = $('nextUp');
  box.replaceChildren(el('span', 'eyebrow', 'Järgmisena'));
  if (!snap) { box.append(el('strong', null, 'Andmed laadimata')); return; }
  const now = new Date();
  for (let w = 0; w < 3; w++) {
    const mon = addDays(mondayOf(now), 7 * w);
    const { out } = lessonsForWeek(mon);
    const nxt = out.find(b => { const end = addDays(mon, b.day); end.setHours(0, mins(b.end), 0, 0); return end > now; });
    if (nxt) {
      const d = addDays(mon, nxt.day);
      const sameDay = isoLocal(d) === isoLocal(now);
      const when = sameDay ? 'Täna' : (isoLocal(d) === isoLocal(addDays(now, 1)) ? 'Homme' : `${DAYS[nxt.day]} ${dm(d)}`);
      const s = new Date(d); s.setHours(0, mins(nxt.start), 0, 0);
      box.append(el('strong', null, `${when} ${nxt.start}–${nxt.end} · ${nxt.campusName}`),
                 el('span', null, [nxt.subject, nxt.group, nxt.room].filter(Boolean).join(' · ')));
      if (sameDay && s <= now) box.append(el('span', 'note', 'Käib praegu'));
      return;
    }
  }
  box.append(el('strong', null, 'Lähinädalatel tunde ei ole'));
}

function renderGrid() {
  const grid = $('grid'), noteBox = $('campusNote');
  grid.replaceChildren(); noteBox.replaceChildren();
  if (!snap) { grid.append(el('p', 'empty', 'Tunniplaani andmeid ei saanud laadida. Vajuta „Värskenda”.')); $('totals').textContent = ''; return; }
  const { out, notes } = lessonsForWeek(weekMon);
  for (const n of notes) {
    if (n.w.state === 'missing') noteBox.append(Object.assign(el('p'), { innerHTML: `<b>${n.meta.name}:</b> selle nädala plaani pole EduPage’is veel avaldatud.` }));
    if (n.w.state === 'hidden') noteBox.append(Object.assign(el('p'), { innerHTML: `<b>${n.meta.name}:</b> plaan on olemas, aga avalikult peidetud (tt ${n.w.v.tt}).` }));
    if (n.w.state === 'carried') noteBox.append(Object.assign(el('p'), { innerHTML: `<b>${n.meta.name}:</b> eraldi nädalaplaani pole, näidatud on viimane kehtiv versioon (${n.w.v.name.split(' (')[0]}).` }));
  }
  const now = new Date(), todayIso = isoLocal(now);
  const subs = [...(snap.kesklinn?.subs || []).map(s => ({ ...s, c: 'Kesklinn' })), ...(snap.mustamae?.subs || []).map(s => ({ ...s, c: 'Mustamäe' }))];
  const other = [];
  for (let i = 0; i < 5; i++) {
    const d = addDays(weekMon, i), iso = isoLocal(d);
    const col = el('div', 'day' + (iso === todayIso ? ' today' : ''));
    const h = el('h3'); h.append(el('span', null, DAYS[i]), el('span', 'mono', dm(d))); col.append(h);
    const dayLessons = out.filter(b => b.day === i);
    if (!dayLessons.length) col.append(el('span', 'empty', 'Tunde pole'));
    for (const b of dayLessons) {
      const kons = /konsultatsioon|järelvastamine/i.test(b.subject);
      const end = new Date(d); end.setHours(0, mins(b.end), 0, 0);
      const card = el('div', `lesson ${b.campus}${kons ? ' kons' : ''}${end < now ? ' past' : ''}`);
      const time = el('div', 'time'); time.append(el('span', null, `${b.start}–${b.end}`), el('span', null, `${b.hours} ak/h`));
      card.append(time, el('div', 'subj', b.subject));
      const meta = [b.group, b.room || 'ruum puudub', b.campusName].filter(Boolean).join(' · ');
      card.append(el('div', 'meta', meta));
      col.append(card);
    }
    for (const s of subs.filter(s => s.date === iso)) {
      if (/Rosin/.test(s.info) || /Rosin/.test(s.group)) col.append(el('div', 'note', `${s.c} · ${s.group} · ${s.periods}. tund: ${s.info}${s.cancelled ? ' (tühistatud)' : ''}`));
      else other.push(`${SHORT[i]} ${dm(d)} · ${s.c} · ${s.group} · ${s.periods}. tund: ${s.info}`);
    }
    grid.append(col);
  }
  const det = $('otherSubs'), ul = det.querySelector('ul');
  ul.replaceChildren(...other.map(t => el('li', null, t)));
  det.hidden = !other.length;
  const tot = { K: 0, M: 0 };
  out.forEach(b => { if (!/konsultatsioon/i.test(b.subject)) tot[b.campus] += b.hours; });
  $('totals').textContent = `Kontakttunde sel nädalal: Kesklinn ${tot.K} ak/h · Mustamäe ${tot.M} ak/h (konsultatsioonideta). Asendusi kontrollitakse eilsest kuni 2 nädalat ette.`;
}

function renderLunch() {
  const chips = $('dayChips'), menus = $('menus');
  chips.replaceChildren(); menus.replaceChildren();
  const todayIso = isoLocal(new Date());
  const days = [0, 1, 2, 3, 4].map(i => isoLocal(addDays(weekMon, i)));
  if (!lunchDay || !days.includes(lunchDay)) lunchDay = days.includes(todayIso) ? todayIso : days[0];
  days.forEach((iso, i) => {
    const b = el('button', null, `${SHORT[i]} ${dm(parseIso(iso))}`);
    b.setAttribute('aria-pressed', iso === lunchDay);
    b.onclick = () => { lunchDay = iso; renderLunch(); };
    chips.append(b);
  });
  const dayIdx = days.indexOf(lunchDay);
  const { out } = snap ? lessonsForWeek(weekMon) : { out: [] };
  const here = new Set(out.filter(b => b.day === dayIdx).map(b => b.campus));
  const order = Object.entries(CAMPUS).sort((a, b) => here.has(b[1].code) - here.has(a[1].code));
  for (const [key, meta] of order) {
    const card = el('div', `menu ${meta.code}`);
    const h = el('h3', null, meta.name);
    if (here.has(meta.code)) h.append(el('small', 'here', 'sul on siin tunnid'));
    card.append(h);
    const rows = snap?.lunch?.[key]?.[lunchDay];
    if (!rows || !rows.length) card.append(el('p', 'empty', snap?.lunch ? 'Selle päeva menüüd pole avaldatud.' : 'Menüüd pole laaditud.'));
    else {
      const ul = el('ul');
      for (const r of rows) {
        const li = el('li', r.label ? 'main' : null);
        if (r.label) li.append(el('span', 'lab', r.label));
        li.append(document.createTextNode(r.name));
        ul.append(li);
      }
      card.append(ul);
    }
    menus.append(card);
  }
}

// ---------- events ----------
$('prev').onclick = () => { weekMon = addDays(weekMon, -7); render(); };
$('next').onclick = () => { weekMon = addDays(weekMon, 7); render(); };
const setTab = t => { tab = t; try { localStorage.setItem('tt-tab', t); } catch (e) {} render(); };
$('tab-tt').onclick = () => setTab('tt');
$('tab-lunch').onclick = () => setTab('lunch');
render();

// ---------- data: site/data/snap.json, written by the GitHub Action ----------
async function load() {
  const st = $('status'), btn = $('refreshBtn');
  btn.disabled = true;
  try {
    const r = await fetch('data/snap.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    snap = await r.json();
    render();
  } catch (e) {
    st.className = 'status err';
    st.textContent = snap ? 'Uuendamine ebaõnnestus, näitan varasemat seisu' : 'Andmeid ei saanud laadida (võrguühendus?)';
  } finally { btn.disabled = false; }
}
$('refreshBtn').onclick = load;
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
